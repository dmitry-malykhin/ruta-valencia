<title>Числа по ступеням</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--ground:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF1F8;--line:#D3DCEA;
--ink:#0F1C33;--ink-soft:#4A5872;--ink-faint:#7C8AA3;--cobalt:#1B4FA8;--cobalt-soft:#E3EBF9;
--naranja:#D45B12;--naranja-soft:#FBE8DB;--verde:#256B4E;--verde-soft:#DFF0E6;
--shadow:0 1px 2px rgba(15,28,51,.06),0 10px 30px rgba(15,28,51,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;--ink:#E7EDF8;
--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;
--ink:#E7EDF8;--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:var(--ink)}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:Bitter,Georgia,serif;margin:0;text-wrap:balance}
h1{font-size:clamp(23px,4vw,32px)}
h2{font-size:20px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--ink-faint)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.who button.on{background:var(--cobalt);color:#fff;border-color:transparent;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select,input,.btn{font:inherit}
select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
border-radius:9px;padding:7px 10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;
cursor:pointer;background:var(--cobalt);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.rounds{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rnd{flex:1;min-width:92px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;
font-size:12px;color:var(--ink-faint);text-align:center;background:var(--surface-2)}
.rnd.now{border-color:var(--naranja);color:var(--naranja);font-weight:600;background:var(--naranja-soft)}
.rnd.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);font-weight:600}
.rnd.lock{opacity:.45}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:4px 0 12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;color:var(--cobalt)}
.stat .k{font-size:12px;color:var(--ink-faint);margin-top:3px}
table.hard{width:100%;border-collapse:collapse;font-size:14px}
table.hard td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.hard td.e{text-align:right;color:var(--naranja);font-weight:600;
font-family:"IBM Plex Mono",monospace}
.card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:10px;padding:26px 18px;text-align:center;user-select:none}
.card.tap{cursor:pointer}
.es{font-size:clamp(28px,5.5vw,42px);font-weight:650}
.ru{font-size:clamp(19px,3.6vw,26px);color:var(--verde);font-weight:500}
.ask{font-size:clamp(21px,4vw,30px);font-weight:600}
.hint{font-size:13px;color:var(--ink-faint)}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-faint);margin:8px 2px 10px}
.pill{padding:3px 10px;border-radius:999px;font-weight:600}
.pill.learn{background:var(--naranja-soft);color:var(--naranja)}
.pill.know{background:var(--verde-soft);color:var(--verde)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{flex:1}
.acts .btn.ghost{flex:0 0 auto;min-width:56px}
.acts .no{background:var(--naranja)}
.acts .yes{background:var(--verde)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 12px;font-size:15.5px;cursor:pointer;text-align:left;line-height:1.35}
.opt:hover{border-color:var(--cobalt)}
.opt.ok{background:var(--verde-soft);border-color:transparent;color:var(--verde);font-weight:600}
.opt.bad{background:var(--naranja-soft);border-color:transparent;color:var(--naranja)}
.type{display:flex;gap:8px;margin-top:12px}
.type input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:13px 14px;font-size:18px;color:var(--ink)}
.type input::placeholder{color:var(--ink-faint)}
.type input:disabled{opacity:.7}
.type input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
.verdict{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:15px}
.verdict.ok{background:var(--verde-soft);color:var(--verde)}
.verdict.bad{background:var(--naranja-soft);color:var(--naranja)}
.verdict b{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 10px;font-size:15px;cursor:pointer;text-align:center;min-height:54px;
display:flex;align-items:center;justify-content:center}
.tile:hover{border-color:var(--cobalt)}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);opacity:.5}
.tile.bad{border-color:var(--naranja);background:var(--naranja-soft)}
.done{text-align:center;padding:24px 12px}
.done .big{font-size:40px}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dot{width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer}
.dot.ok{background:var(--verde-soft);color:var(--verde);border-color:transparent;font-weight:600}
.dot.now{border-color:var(--naranja);color:var(--naranja);font-weight:700}
.warn{background:var(--naranja-soft);color:var(--naranja);border-radius:10px;padding:11px 14px;
font-size:13.5px;margin-bottom:12px}
.audio{background:var(--cobalt-soft);border:1px solid transparent;color:var(--cobalt);
border-radius:999px;width:62px;height:62px;font-size:25px;cursor:pointer;display:flex;
align-items:center;justify-content:center;transition:transform .12s}
.audio:hover{transform:scale(1.06)}
.audio:active{transform:scale(.94)}
.audio.playing{background:var(--cobalt);color:#fff}
.mic{width:96px;height:96px;border-radius:999px;border:none;cursor:pointer;font-size:38px;
background:var(--cobalt);color:#fff;display:flex;align-items:center;justify-content:center;
transition:transform .15s}
.mic:hover{transform:scale(1.04)}
.mic.rec{background:var(--naranja);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,91,18,.5)}70%{box-shadow:0 0 0 18px rgba(212,91,18,0)}100%{box-shadow:0 0 0 0 rgba(212,91,18,0)}}
.heard{font-size:19px;color:var(--ink-soft);margin-top:14px;min-height:26px}
.heard b{color:var(--ink)}
.card{position:relative}
.reveal{width:100%;margin-top:12px}
.kbd{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);border:1px solid var(--line);
border-radius:5px;padding:1px 6px;font-size:11.5px}
.tip{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:12px}
.auto{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.auto input{width:16px;height:16px;accent-color:var(--cobalt)}
.voicebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
padding-top:10px;border-top:1px dashed var(--line)}
.voicebar select{flex:1;min-width:180px;max-width:420px}
.voicebar .lab{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
footer{margin-top:24px;font-size:12.5px;color:var(--ink-faint);text-align:center}
a{color:var(--cobalt)}
@media (max-width:520px){.opts{grid-template-columns:1fr}}

.big-v{font-size:clamp(28px,5.5vw,42px);font-weight:650}
.conj{width:100%;border-collapse:separate;border-spacing:0 8px}
.conj td{vertical-align:middle}
.conj td.p{width:40%;padding-right:10px;font-size:15px;color:var(--ink-soft)}
.conj td.p b{color:var(--ink);font-weight:600}
.conj input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:11px 13px;font-size:17px;color:var(--ink)}
.conj input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
.conj tr.ok input{background:var(--verde-soft);border-color:transparent;color:var(--verde);font-weight:600}
.conj tr.bad input{border-color:var(--naranja);background:var(--naranja-soft)}
.conj td.a{width:52px;padding-left:8px;text-align:right}
.mini{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
border-radius:999px;width:38px;height:38px;font-size:16px;cursor:pointer}
.mini.on{background:var(--cobalt);color:#fff;border-color:transparent}
.mini:disabled{opacity:.3;cursor:default}
.formlist{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:8px;margin-top:16px;width:100%}
@media(max-width:520px){.formlist{grid-template-columns:1fr;grid-auto-flow:row}}
.conjgrid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:12px 16px;width:100%}
@media(max-width:640px){.conjgrid{grid-template-columns:1fr;grid-auto-flow:row}}
.cell{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface-2);
border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.cell .p{flex:1 1 100%;font-size:12.5px;color:var(--ink-soft);line-height:1.3;margin-bottom:1px}
.cell .p b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
.cell input{flex:1 1 100px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16.5px;color:var(--ink)}
.cell input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
.cell.ok{border-color:var(--verde)}
.cell.ok input{background:var(--verde-soft);border-color:transparent;color:var(--verde);font-weight:600}
.cell.bad{border-color:var(--naranja)}
.cell.bad input{border-color:var(--naranja);background:var(--naranja-soft)}
.frase{font-size:clamp(19px,3.4vw,26px);line-height:1.6;margin:6px 0 4px;text-align:center}
.frase .gap{display:inline-block;min-width:96px;border-bottom:2px dashed var(--cobalt);color:var(--cobalt);font-weight:600}
.frase-ru{color:var(--ink-soft);font-size:16px;text-align:center;margin-bottom:14px}
.warm{background:var(--naranja-soft);border:1px solid var(--naranja);color:var(--naranja);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.formlist div{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
padding:8px 10px;font-size:15px;text-align:left;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.formlist .fw{font-weight:600;flex:1;min-width:0}
.formlist .fplay{width:32px;height:32px;font-size:14px;flex:none}
.formlist span{width:100%}
.formlist span{color:var(--ink-faint);font-size:11.5px;display:block}
.vtable{width:100%;border-collapse:collapse;font-size:14.5px}
.vtable th{text-align:left;font-size:12px;color:var(--ink-faint);padding:6px 8px;
border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.vtable td{padding:8px;border-bottom:1px solid var(--line)}
.vtable td.v{font-weight:600;white-space:nowrap}
.vtable td.f{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--ink-soft)}
.vtable tr.irr td.v{color:var(--naranja)}
.taskline{margin-top:16px;font-size:16.5px;color:var(--ink-soft);line-height:1.6}
.taskline b{color:var(--ink);font-weight:600}
.cell .mini{flex:0 0 auto}
.cell .hintbtn{width:36px;height:36px;font-weight:700}
.cell [data-play]{width:36px;height:36px}
.rnd.todo{border-color:var(--line);background:var(--surface-2);color:var(--ink-soft)}
.rnd.free{cursor:pointer}
.rnd.free:hover{border-color:var(--cobalt)}
.rnd.ok{cursor:pointer}
.rnd.ok:hover{border-color:var(--verde)}
.dlabel{font-weight:600;margin-right:10px}
.vchip{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
border-radius:999px;padding:5px 13px;margin:3px 6px 3px 0;font-size:14px;cursor:pointer}
.vchip:hover{border-color:var(--cobalt)}
.vchip.done{background:var(--verde-soft);border-color:var(--verde);color:var(--verde);font-weight:600}
.vchip.now{outline:2px solid var(--naranja);outline-offset:1px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 14px}
@media(max-width:640px){.steps{grid-template-columns:repeat(2,1fr)}}
.stp{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
padding:7px 9px;font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
.stp .n{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
border-radius:999px;background:var(--line);color:var(--ink-soft);font-size:11px;font-weight:700;flex:none}
.stp.now{border-color:var(--naranja);background:var(--naranja-soft);color:var(--naranja);font-weight:600}
.stp.now .n{background:var(--naranja);color:#fff}
.stp.done{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.stp.done .n{background:var(--verde);color:#fff}
.rnd .rp{display:block;font-size:10.5px;font-weight:500;opacity:.85;margin-top:3px;
font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.striplabel{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
text-transform:uppercase;color:var(--ink-faint);margin:2px 0 6px}
.stp.open{cursor:pointer}
.stp.open:hover{border-color:var(--cobalt)}
.rndline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;
color:var(--ink-soft);padding:8px 2px}
.rndline b{color:var(--ink)}
.striplabel .btn{margin-left:8px;vertical-align:middle}

.digit{font-family:"IBM Plex Mono",monospace;font-size:clamp(46px,10vw,86px);font-weight:600;
line-height:1;text-align:center;color:var(--cobalt)}
.word{font-size:clamp(26px,5vw,40px);font-weight:600;text-align:center;margin-top:10px}
.steps2{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.stx{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 13px;
font-size:13.5px;color:var(--ink-soft);cursor:pointer}
.stx.on{background:var(--cobalt);border-color:transparent;color:#fff;font-weight:600}
.stx.done{border-color:var(--verde);color:var(--verde)}
.stx.extra{border-style:dashed}
.why{font-size:13.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);
border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
@media(max-width:640px){.modes{grid-template-columns:repeat(2,1fr)}}
.md{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px;
font-size:12.5px;color:var(--ink-faint);text-align:center;cursor:pointer}
.md.on{border-color:var(--naranja);background:var(--naranja-soft);color:var(--naranja);font-weight:600}
.md.done{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.speedrow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.phone{font-family:"IBM Plex Mono",monospace;font-size:clamp(24px,5vw,38px);letter-spacing:.08em;
text-align:center;font-weight:600}
</style>

  <p style="color:var(--ink-soft);margin-top:6px">Не по одной цифре, а по схемам: сначала опорные слова,
     потом правило сборки, потом диктант на слух.</p>

[300, "trescientos"], [400, "cuatrocientos"], [500, "quinientos"], [600, "seiscientos"], [700, "setecientos"], [800, "ochocientos"], [900, "novecientos"]]}, {"id": "u8", "name": "Сборка 101-999", "why": "Сотня + десяток + единица. 100 внутри числа звучит как ciento.", "nums": [101, 115, 128, 134, 156, 199, 230, 247, 305, 372, 418, 543, 615, 728, 890, 945], "w": [[101, "ciento uno"], [115, "ciento quince"], [128, "ciento veintiocho"], [134, "ciento treinta y cuatro"], [156, "ciento cincuenta y seis"], [199, "ciento noventa y nueve"], [230, "doscientos treinta"], [247, "doscientos cuarenta y siete"], [305, "trescientos cinco"], [372, "trescientos setenta y dos"], [418, "cuatrocientos dieciocho"], [543, "quinientos cuarenta y tres"], [615, "seiscientos quince"], [728, "setecientos veintiocho"], [890, "ochocientos noventa"], [945, "novecientos cuarenta y cinco"]]}, {"id": "u9", "name": "Тысячи", "extra": true, "why": "Дополнительно. Нужны для зарплаты, аренды и цен на технику: mil, dos mil, diez mil.", "nums": [1000, 2000, 5000, 10000, 20000, 50000], "w": [[1000, "mil"], [2000, "dos mil"], [5000, "cinco mil"], [10000, "diez mil"], [20000, "veinte mil"], [50000, "cincuenta mil"]]}, {"id": "u10", "name": "Сотни тысяч и миллион", "extra": true, "why": "Дополнительно. Встречаются в ценах на жильё: cien mil, un millón. Millón во множественном millones.", "nums": [100000, 200000, 500000, 1000000, 2000000], "w": [[100000, "cien mil"], [200000, "doscientos mil"], [500000, "quinientos mil"], [1000000, "un millón"], [2000000, "dos millones"]]}];
var WHO=[{id:"dmitry",name:"Дмитрий"},{id:"yulia",name:"Юлия"},{id:"mihail",name:"Михаил"},{id:"darya",name:"Дарья"}];
var MODES=[{k:"learn",t:"1. Знакомство"},{k:"read",t:"2. Вижу цифру"},
           {k:"write",t:"3. Пишу словом"},{k:"dictado",t:"4. Слышу, пишу цифрой"},
           {k:"say",t:"5. Говорю вслух"}];
var S={who:"dmitry",step:0,mode:0,queue:[],idx:0,ok:0,wrong:0,phone:null};

function el(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return (s||"").toLowerCase().trim().replace(/[.,!?¡¿]/g,"")
  .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ")}
function mkey(si,mi){return "num_"+S.who+"_"+STEPS[si].id+"_"+MODES[mi].k}
function modeDone(si,mi){return ls(mkey(si,mi))==="1"}
function markMode(si,mi){ls(mkey(si,mi),"1")}
function stepDone(si){return MODES.every(function(m,mi){return modeDone(si,mi)})}

/* ---------- голос ---------- */
var VOICES=[], esVoice=null;
function vrank(v){var n=(v.name||"").toLowerCase(),l=(v.lang||"").toLowerCase(),r=0;
  if(l.indexOf("es-es")===0)r+=100; if(/premium|enhanced|natural/.test(n))r+=40;
  if(/m[oó]nica|marisol|paulina/.test(n))r+=20; if(/compact|eloquence/.test(n))r-=30; return r}
function collectVoices(){
  var v=[];try{v=speechSynthesis.getVoices()||[]}catch(e){}
  VOICES=v.filter(function(x){return /^es[-_]?/i.test(x.lang||"")}).sort(function(a,b){return vrank(b)-vrank(a)});
  var saved=ls("esp_voice");
  esVoice=VOICES.filter(function(x){return x.name===saved})[0]||VOICES[0]||null;
  var sel=el("voice"); if(!sel) return;
  sel.innerHTML=VOICES.length?VOICES.map(function(x){
    return '<option value="'+x.name.replace(/"/g,"")+'"'+(esVoice&&x.name===esVoice.name?" selected":"")+'>'+
      x.name+'</option>'}).join(""):'<option>голосов нет</option>';
}
function speakAt(t,rate){try{if(!esVoice)collectVoices();
  var u=new SpeechSynthesisUtterance(t);u.lang=(esVoice&&esVoice.lang)||"es-ES";u.rate=rate||.85;
  if(esVoice)u.voice=esVoice;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function speak(t){speakAt(t,.85)}

/* ---------- каркас ---------- */
function renderWho(){el("who").innerHTML=WHO.map(function(w){
  return '<button data-who="'+w.id+'"'+(w.id===S.who?' class="on"':'')+'>'+w.name+'</button>'}).join("")}
function renderSteps(){
  el("steps").innerHTML=STEPS.map(function(s,i){
    return '<div class="stx'+(i===S.step?" on":"")+(stepDone(i)?" done":"")+
      (s.extra?" extra":"")+'" data-step="'+i+'">'+
      s.name+(s.extra?' <span class="mono" style="font-size:10px">доп</span>':'')+
      (stepDone(i)?" ✓":"")+'</div>'}).join("");
}
function renderModes(){
  el("modes").innerHTML=MODES.map(function(m,i){
    return '<div class="md'+(i===S.mode?" on":"")+(modeDone(S.step,i)?" done":"")+'" data-mode="'+i+'">'+
      m.t+(modeDone(S.step,i)?" ✓":"")+'</div>'}).join("");
}
function head(){
  return '<div class="counter"><span class="pill learn">Ошибок: '+S.wrong+'</span>'+
    '<span class="mono">Осталось: '+Math.max(0,S.queue.length-S.idx)+'</span>'+
    '<span class="pill know">Верно: '+S.ok+'</span></div>';
}
function startMode(){
  renderSteps(); renderModes();
  el("why").textContent=STEPS[S.step].why;
  S.idx=0; S.ok=0; S.wrong=0;
  var pool=STEPS[S.step].w;
  var k=MODES[S.mode].k;
  if(k==="learn"){ S.queue=pool.slice(); return rLearn() }
  if(k==="read"){ S.queue=sh(pool); return rRead() }
  if(k==="write"){ S.queue=sh(pool); return rWrite() }
  if(k==="dictado"){ S.queue=sh(pool); return rDictado() }
  S.queue=sh(pool); return rSay();
}
function modeDoneScreen(){
  markMode(S.step,S.mode); renderSteps(); renderModes();
  var last=S.mode>=MODES.length-1;
  el("stage").innerHTML='<div class="panel done"><div class="big">✓</div>'+
    '<h2>'+MODES[S.mode].t+' пройден</h2>'+
    '<p class="hint" style="margin:8px 0 16px">Верно '+S.ok+', ошибок '+S.wrong+'</p>'+
    (last?'<button class="btn" id="nextstep">Следующая ступень</button> '
         :'<button class="btn" id="go">Дальше</button> ')+
    '<button class="btn ghost" id="re">Ещё раз</button></div>';
  if(el("go")) el("go").onclick=function(){S.mode++;startMode()};
  if(el("nextstep")) el("nextstep").onclick=function(){
    if(S.step<STEPS.length-1){S.step++;S.mode=0;startMode()} else {S.mode=0;startMode()}};
  el("re").onclick=startMode;
}


/* ---------- микрофон ---------- */
var MIC_ERRORS={
  "not-allowed":"браузер не дал доступ к микрофону · разрешите его в адресной строке слева",
  "service-not-allowed":"распознавание речи отключено в настройках браузера",
  "audio-capture":"микрофон не найден · проверьте, что он подключён и выбран в системе",
  "no-speech":"ничего не услышал · говорите ближе к микрофону и чуть громче",
  "aborted":"запись прервалась, нажмите микрофон ещё раз",
  "network":"нет связи с распознаванием · нужен интернет"
};
function speechOK(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];
  for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,
    d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function heardMatches(alts, word, digits){
  var target=norm(word), dg=String(digits);
  return alts.some(function(a){
    var n=norm(a);
    if(n===target||n.indexOf(target)>-1) return true;
    if(n.replace(/\D/g,"")===dg) return true;   // распознаватель часто отдаёт цифрами
    return lev(n,target)<=Math.max(1,Math.floor(target.length/6));
  });
}
function micRound(opts){
  var box=el("heard"), btn=el("mic");
  if(!btn) return;
  btn.onclick=function(){
    var Rec=window.SpeechRecognition||window.webkitSpeechRecognition, rec=new Rec();
    rec.lang="es-ES"; rec.maxAlternatives=5; rec.interimResults=false;
    btn.textContent="🎤 слушаю…"; btn.disabled=true;
    rec.onresult=function(ev){
      var alts=[]; for(var i=0;i<ev.results[0].length;i++) alts.push(ev.results[0][i].transcript);
      var hit=heardMatches(alts, opts.word, opts.digits);
      box.innerHTML=(hit?'<b style="color:var(--verde)">совпало: </b>':'не совпало · услышал: ')+alts[0];
      btn.textContent="🎤 Сказать ещё раз"; btn.disabled=false;
      opts.done(hit);
    };
    rec.onerror=function(ev){
      box.textContent=MIC_ERRORS[ev&&ev.error]||("не получилось: "+((ev&&ev.error)||"ошибка"));
      btn.textContent="🎤 Ещё раз"; btn.disabled=false;
    };
    rec.onend=function(){ if(btn.disabled){btn.textContent="🎤 Ещё раз";btn.disabled=false} };
    try{rec.start()}catch(e){btn.disabled=false}
  };
}

/* ---------- 5. говорю вслух ---------- */
function rSay(){
  if(S.idx>=S.queue.length) return modeDoneScreen();
  var it=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="digit">'+it[0]+'</div>'+
    '<div class="hint" style="margin-top:12px">скажите это число по-испански</div>'+
    '<div id="heard" class="hint" style="min-height:22px;margin-top:10px"></div></div>'+
    '<div class="acts">'+
    (speechOK()?'<button class="btn" id="mic">🎤 Сказать</button>':'')+
    '<button class="btn ghost" id="hear">🔊 Как звучит</button>'+
    '<button class="btn ghost" id="skip">Дальше</button></div>'+
    '<p class="tip">'+(speechOK()
      ?'Пока не совпало — пробуйте ещё. «Дальше» переходит по вашему решению'
      :'Этот браузер не слышит речь · скажите вслух и проверьте себя кнопкой «Как звучит»')+'</p>';
  el("hear").onclick=function(){speak(it[1])};
  el("skip").onclick=function(){S.idx++;rSay()};
  micRound({word:it[1],digits:it[0],done:function(hit){
    if(hit){ S.ok++; S.idx++; speak(it[1]); setTimeout(rSay,900) }
    else { S.wrong++ }
  }});
}

/* ---------- 1. знакомство: цифра, слово, звук вместе ---------- */
function rLearn(){
  if(S.idx>=S.queue.length) return modeDoneScreen();
  var it=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="digit">'+it[0]+'</div>'+
    '<div class="word">'+it[1]+'</div>'+
    '<button class="audio" id="spk">🔊</button></div>'+
    '<div class="acts"><button class="btn ghost" id="slow">🐢 Медленнее</button>'+
    '<button class="btn" id="next">Запомнил, дальше</button></div>'+
    '<p class="tip">Цифра, слово и звук вместе · прочитайте вслух</p>';
  el("spk").onclick=function(){speak(it[1])};
  el("slow").onclick=function(){speakAt(it[1],.55)};
  el("next").onclick=function(){S.ok++;S.idx++;rLearn()};
  setTimeout(function(){speak(it[1])},300);
}

/* ---------- 2. вижу цифру, выбираю слово ---------- */
function rRead(){
  if(S.idx>=S.queue.length) return modeDoneScreen();
  var it=S.queue[S.idx];
  var pool=STEPS[S.step].w.filter(function(x){return x[0]!==it[0]});
  var opts=sh(pool).slice(0,3).concat([it]);
  opts=sh(opts);
  el("stage").innerHTML=head()+
    '<div class="card"><div class="digit">'+it[0]+'</div>'+
    '<div class="hint" style="margin-top:12px">как это звучит по-испански?</div></div>'+
    '<div class="opts" id="opts">'+opts.map(function(o,i){
      return '<button class="opt" data-w="'+o[1]+'">'+(i+1)+'. '+o[1]+'</button>'}).join("")+'</div>'+
    '<div id="v"></div><p class="tip">Ошиблись — вопрос вернётся в конец</p>';
  el("opts").onclick=function(e){
    var b=e.target.closest(".opt"); if(!b) return;
    var good=b.dataset.w===it[1];
    if(good){S.ok++;S.idx++} else {S.wrong++;S.queue.push(it)}
    el("v").innerHTML='<div class="verdict '+(good?"ok":"bad")+'"><b>'+it[0]+' — '+it[1]+'</b></div>';
    speak(it[1]);
    setTimeout(rRead, good?900:1800);
  };
}

/* ---------- 3. пишу словом ---------- */
function rWrite(){
  if(S.idx>=S.queue.length) return modeDoneScreen();
  var it=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="digit">'+it[0]+'</div>'+
    '<div class="hint" style="margin-top:12px">напишите это число словами</div></div>'+
    '<div class="type"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" '+
    'placeholder="словами по-испански"><button class="btn" id="ok">Проверить</button></div>'+
    '<div id="v"></div>'+
    '<div class="acts" style="margin-top:8px"><button class="btn ghost" id="hint">Подсказать</button></div>'+
    '<p class="tip">Ошиблись — форму надо набрать верно, потом идём дальше</p>';
  var inp=el("inp"); inp.focus(); var retype=false, locked=false;
  function check(){
    if(locked) return; var a=norm(inp.value); if(!a) return;
    if(retype){
      if(a!==norm(it[1])){el("v").innerHTML='<div class="verdict bad">наберите <b>'+it[1]+'</b></div>';return}
      locked=true; speak(it[1]); S.idx++; setTimeout(rWrite,700); return;
    }
    if(a===norm(it[1])){
      locked=true; S.ok++; S.idx++;
      el("v").innerHTML='<div class="verdict ok"><b>'+it[0]+' — '+it[1]+'</b></div>';
      speak(it[1]); setTimeout(rWrite,900); return;
    }
    S.wrong++; retype=true; S.queue.push(it);
    el("v").innerHTML='<div class="verdict bad"><b>'+it[1]+'</b> · наберите сами</div>';
    speak(it[1]); inp.value=""; inp.placeholder="наберите: "+it[1]; inp.focus();
  }
  el("hint").onclick=function(){
    if(locked) return;
    S.wrong++; retype=true;
    el("v").innerHTML='<div class="verdict bad"><b>'+it[1]+'</b> · наберите сами</div>';
    speak(it[1]); inp.value=""; inp.placeholder="наберите: "+it[1]; inp.focus();
  };
  el("ok").onclick=check; inp.onkeydown=function(e){if(e.key==="Enter")check()};
}

/* ---------- 4. слышу, пишу цифрой ---------- */
function rDictado(){
  if(S.idx>=S.queue.length) return modeDoneScreen();
  var it=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="hint">послушайте и напишите цифрой</div>'+
    '<button class="audio" id="spk">🔊</button>'+
    '<div class="speedrow">'+
    '<button class="btn ghost sm" data-rate="0.5">очень медленно</button>'+
    '<button class="btn ghost sm" data-rate="0.75">медленно</button>'+
    '<button class="btn ghost sm" data-rate="1">обычно</button></div></div>'+
    '<div class="type"><input id="inp" inputmode="numeric" autocomplete="off" '+
    'placeholder="цифрами"><button class="btn" id="ok">Проверить</button></div>'+
    '<div id="v"></div><p class="tip">Пишите арабскими цифрами · 🔊 повторяет</p>';
  el("spk").onclick=function(){speak(it[1])};
  el("stage").querySelector(".speedrow").onclick=function(e){
    var b=e.target.closest("[data-rate]"); if(!b) return;
    speakAt(it[1], parseFloat(b.dataset.rate));
  };
  setTimeout(function(){speak(it[1])},350);
  var inp=el("inp"); inp.focus(); var locked=false;
  function check(){
    if(locked) return; var a=inp.value.replace(/\D/g,""); if(!a) return;
    locked=true;
    var good=parseInt(a,10)===it[0];
    if(good){S.ok++;S.idx++} else {S.wrong++;S.queue.push(it)}
    el("v").innerHTML='<div class="verdict '+(good?"ok":"bad")+'"><b>'+it[0]+' — '+it[1]+'</b></div>';
    speak(it[1]);
    setTimeout(rDictado, good?900:2000);
  }
  el("ok").onclick=check; inp.onkeydown=function(e){if(e.key==="Enter")check()};
}

/* ---------- телефон: диктовка парами на трёх скоростях ---------- */
function phoneDigits(){
  var g=[];
  for(var i=0;i<3;i++) g.push(Math.floor(Math.random()*90)+10);
  return g;
}
function phoneText(groups){
  return groups.map(function(n){return numWord(n)}).join(", ");
}
function numWord(n){
  var all={};
  STEPS.forEach(function(s){ s.w.forEach(function(x){ all[x[0]]=x[1] }) });
  if(all[n]) return all[n];
  var tens={20:"veinte",30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",
            70:"setenta",80:"ochenta",90:"noventa"};
  var t=Math.floor(n/10)*10, u=n%10;
  return u? tens[t]+" y "+all[u] : tens[t];
}
function rPhone(rate,mode){
  if(!S.phone) S.phone={groups:phoneDigits(),tries:0};
  S.phoneMode=mode||S.phoneMode||"escuchar";
  if(S.phoneMode==="decir") return rPhoneSay(rate);
  var g=S.phone.groups, target=g.join("");
  el("stage").innerHTML=head()+
    '<div class="card"><div class="hint">вам диктуют номер · запишите цифрами</div>'+
    '<button class="audio" id="spk">🔊</button>'+
    '<div class="speedrow">'+
    '<button class="btn ghost sm" data-rate="0.5">очень медленно</button>'+
    '<button class="btn ghost sm" data-rate="0.75">медленно</button>'+
    '<button class="btn ghost sm" data-rate="1">как говорят</button></div></div>'+
    '<div class="type"><input id="inp" inputmode="numeric" autocomplete="off" '+
    'placeholder="шесть цифр"><button class="btn" id="ok">Проверить</button></div>'+
    '<div id="v"></div>'+
    '<div class="acts" style="margin-top:8px">'+
    '<button class="btn ghost" id="skip">Другой номер</button>'+
    '<button class="btn ghost" id="flip">Наоборот: продиктовать самому</button></div>'+
    '<p class="tip">В Испании номер диктуют парами: 65 · 43 · 12</p>';
  function say(r){ speakAt(phoneText(g), r) }
  el("spk").onclick=function(){say(rate||.75)};
  el("stage").querySelector(".speedrow").onclick=function(e){
    var b=e.target.closest("[data-rate]"); if(!b) return; say(parseFloat(b.dataset.rate));
  };
  setTimeout(function(){say(rate||.75)},350);
  el("skip").onclick=function(){S.phone=null;rPhone(rate)};
  el("flip").onclick=function(){S.phone=null;rPhone(rate,"decir")};
  var inp=el("inp"); inp.focus();
  el("ok").onclick=check; inp.onkeydown=function(e){if(e.key==="Enter")check()};
  function check(){
    var a=inp.value.replace(/\D/g,""); if(!a) return;
    var good=a===target;
    if(good){S.ok++} else {S.wrong++}
    el("v").innerHTML='<div class="verdict '+(good?"ok":"bad")+'"><b>'+
      g.join(" · ")+'</b><br>'+phoneText(g)+'</div>';
    say(.6);
    if(good){ S.phone=null; setTimeout(function(){rPhone(rate)},2200) }
  }
}


function rPhoneSay(rate){
  var g=S.phone.groups, word=phoneText(g), digits=g.join("");
  el("stage").innerHTML=head()+
    '<div class="card"><div class="hint">продиктуйте этот номер по-испански, парами</div>'+
    '<div class="phone">'+g.join(" · ")+'</div>'+
    '<div id="heard" class="hint" style="min-height:22px;margin-top:12px"></div></div>'+
    '<div class="acts">'+
    (speechOK()?'<button class="btn" id="mic">🎤 Сказать</button>':'')+
    '<button class="btn ghost" id="hear">🔊 Послушать образец</button>'+
    '<button class="btn ghost" id="skip">Другой номер</button>'+
    '<button class="btn ghost" id="flip">Наоборот: записать на слух</button></div>'+
    '<p class="tip">Говорите парами, как в Испании: sesenta y cinco, cuarenta y tres…</p>';
  el("hear").onclick=function(){speakAt(word,rate||.75)};
  el("skip").onclick=function(){S.phone=null;rPhoneSay(rate)};
  el("flip").onclick=function(){S.phone=null;rPhone(rate,"escuchar")};
  micRound({word:word,digits:digits,done:function(hit){
    if(hit){ S.ok++; speakAt(word,.7); S.phone=null; setTimeout(function(){rPhoneSay(rate)},2000) }
    else { S.wrong++ }
  }});
}

function boot(){
  var whoFromUrl=(location.search.match(/who=([a-z]+)/)||[])[1];
  if(whoFromUrl && WHO.some(function(p){return p.id===whoFromUrl})) ls("esp_who",whoFromUrl);
  S.who=ls("esp_who")||"dmitry";
  if(!WHO.filter(function(w){return w.id===S.who}).length) S.who="dmitry";
  renderWho();
  el("who").onclick=function(e){var b=e.target.closest("button[data-who]");if(!b)return;
    S.who=b.dataset.who;ls("esp_who",S.who);renderWho();startMode()};
  el("steps").onclick=function(e){var d=e.target.closest(".stx");if(!d)return;
    S.step=+d.dataset.step;S.mode=0;startMode()};
  el("modes").onclick=function(e){var d=e.target.closest(".md");if(!d)return;
    S.mode=+d.dataset.mode;startMode()};
  el("phonebtn").onclick=function(){S.phone=null;S.ok=0;S.wrong=0;S.queue=[];rPhone(.75)};
  el("voice").onchange=function(){
    var name=this.value, v=VOICES.filter(function(x){return x.name===name})[0];
    if(v){esVoice=v;ls("esp_voice",v.name);speak("uno, dos, tres")}};
  try{speechSynthesis.onvoiceschanged=collectVoices}catch(e){}
  collectVoices();
  if(location.hash==="#phone"){
    S.phone=null; S.ok=0; S.wrong=0; S.queue=[];
    renderSteps(); renderModes();
    el("why").textContent="Диктовка номера · записать на слух и продиктовать самому.";
    return rPhone(.75,"escuchar");
  }
  // продолжаем с первой незакрытой ступени
  for(var i=0;i<STEPS.length;i++){ if(!STEPS[i].extra && !stepDone(i)){S.step=i;break} }
  for(var m=0;m<MODES.length;m++){ if(!modeDone(S.step,m)){S.mode=m;break} }
  startMode();
}
boot();
</script>
