<style>
:root{--ground:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF1F8;--line:#D3DCEA;

--shadow:0 1px 2px rgba(15,28,51,.06),0 10px 30px rgba(15,28,51,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;--ink:#E7EDF8;
--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;
--ink:#E7EDF8;--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:22px 18px 60px}
h1,h2{font-family:Bitter,Georgia,serif;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--ink-faint)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.who button.on{background:var(--cobalt);color:#fff;border-color:transparent;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.daybar .t{font-weight:600}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
select,.btn{font:inherit}
select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
border-radius:9px;padding:8px 10px;max-width:100%}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;
cursor:pointer;background:var(--cobalt);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.btn.wide{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);min-height:230px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:12px;padding:28px 20px;cursor:pointer;
text-align:center;user-select:none}
.es{font-size:clamp(30px,6vw,46px);font-weight:650}
.ru{font-size:clamp(20px,4vw,28px);color:var(--verde);font-weight:500}
.hint{font-size:13px;color:var(--ink-faint)}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-faint);
margin:10px 2px 12px}
.pill{padding:3px 10px;border-radius:999px;font-weight:600}
.pill.learn{background:var(--naranja-soft);color:var(--naranja)}
.pill.know{background:var(--verde-soft);color:var(--verde)}
.acts{display:flex;gap:10px;margin-top:14px}
.acts .btn{flex:1}
.acts .no{background:var(--naranja)}
.acts .yes{background:var(--verde)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:11px;
padding:14px 10px;font-size:15px;cursor:pointer;text-align:center;min-height:56px;
display:flex;align-items:center;justify-content:center}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);opacity:.55}
.tile.bad{border-color:var(--naranja);background:var(--naranja-soft)}
.done{text-align:center;padding:26px 12px}
.done .big{font-size:44px}
.weeks{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.dot{width:26px;height:26px;border-radius:7px;background:var(--surface-2);
border:1px solid var(--line);font-size:11px;display:flex;align-items:center;
justify-content:center;color:var(--ink-faint);cursor:pointer}
.dot.ok{background:var(--verde-soft);color:var(--verde);border-color:transparent;font-weight:600}
.dot.now{border-color:var(--naranja);color:var(--naranja);font-weight:700}
footer{margin-top:26px;font-size:12.5px;color:var(--ink-faint);text-align:center}
a{color:var(--cobalt)}
</style>

var START = new Date(2026,7,24);
var WHO = [
 {id:"papa",  name:"Папа",     track:"adults"},
 {id:"mama",  name:"Мама",     track:"adults"},
 {id:"mayor", name:"Старший",  track:"kids"},
 {id:"menor", name:"Младшая",  track:"kids"}
];
var S = {who:null, day:1, list:[], idx:0, learn:[], know:0, mode:"cards"};

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
function today(){ var n=new Date(); n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var d=Math.floor((n-START)/86400000)+1; return Math.max(1,Math.min(52,d)); }
function person(){ return WHO.filter(function(w){return w.id===S.who})[0]; }
function sets(){ return DATA[person().track]; }
function setFor(day){ var a=sets().filter(function(s){return s.day===day}); return a[0]||sets()[0]; }
function doneKey(){ return "esp_done_"+S.who; }
function doneDays(){ try{ return JSON.parse(store(doneKey())||"[]"); }catch(e){ return []; } }
function markDone(d){ var a=doneDays(); if(a.indexOf(d)<0){a.push(d); store(doneKey(),JSON.stringify(a));} }

function el(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function renderWho(){
  var h="";
  WHO.forEach(function(w){ h+='<button data-who="'+w.id+'"'+(w.id===S.who?' class="on"':'')+'>'+w.name+'</button>'; });
  el("who").innerHTML=h;
}
function renderDays(){
  var done=doneDays(), t=today(), h="";
  for(var d=1;d<=52;d++){
    var c="dot"+(done.indexOf(d)>=0?" ok":"")+(d===S.day?" now":"");
    h+='<div class="'+c+'" data-day="'+d+'">'+d+'</div>';
  }
  el("weeks").innerHTML=h;
  el("progress").textContent=done.length+" из 52 дней";
}
function startDay(d){
  S.day=d; var s=setFor(d);
  S.list=shuffle(s.w); S.idx=0; S.learn=[]; S.know=0; S.mode="cards";
  el("setname").textContent=s.name;
  el("daysel").value=d;
  renderDays(); renderCard();
}
function renderCard(){
  if(S.idx>=S.list.length){
    if(S.learn.length){ S.list=shuffle(S.learn); S.learn=[]; S.idx=0; }
    else { return renderMatchIntro(); }
  }
  var w=S.list[S.idx];
  el("stage").innerHTML =
    '<div class="counter"><span class="pill learn">Ещё учу: '+S.learn.length+'</span>'+
    '<span class="mono">'+(S.idx+1)+' / '+S.list.length+'</span>'+
    '<span class="pill know">Знаю: '+S.know+'</span></div>'+
    '<div class="card" id="flip"><div class="es">'+w[0]+'</div>'+
    '<div class="hint" id="back">нажмите, чтобы увидеть перевод</div></div>'+
    '<div class="acts"><button class="btn no" id="no">Не вспомнил</button>'+
    '<button class="btn yes" id="yes">Знаю</button></div>'+
    '<p class="hint" style="margin-top:12px;text-align:center">Произнесите вслух, потом проверьте</p>';
  var shown=false;
  el("flip").onclick=function(){ if(shown) return; shown=true;
    el("back").outerHTML='<div class="ru">'+w[1]+'</div>'; speak(w[0]); };
  el("no").onclick=function(){ S.learn.push(w); S.idx++; renderCard(); };
  el("yes").onclick=function(){ S.know++; S.idx++; renderCard(); };
}
function speak(t){
  try{ var u=new SpeechSynthesisUtterance(t); u.lang="es-ES"; u.rate=.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function renderMatchIntro(){
  el("stage").innerHTML='<div class="panel done"><div class="big">✓</div>'+
    '<h2>Карточки пройдены</h2><p class="hint" style="margin:10px 0 18px">'+
    'Теперь закрепим игрой: соедините пары на скорость</p>'+
    '<button class="btn" id="tomatch">Играть в подбор</button> '+
    '<button class="btn ghost" id="finish">Завершить день</button></div>';
  el("tomatch").onclick=startMatch;
  el("finish").onclick=finishDay;
}
var M={sel:null,left:0};
function startMatch(){
  var s=setFor(S.day).w, pick=shuffle(s).slice(0,8);
  var tiles=[]; pick.forEach(function(p,i){ tiles.push({k:i,t:p[0],side:"es"}); tiles.push({k:i,t:p[1],side:"ru"}); });
  tiles=shuffle(tiles); M.sel=null; M.left=pick.length;
  var h='<div class="panel"><div class="daybar"><span class="t">Соедините пары</span>'+
        '<span class="mono" id="left">'+M.left+' пар</span></div></div><div class="grid" id="tiles">';
  tiles.forEach(function(t,i){ h+='<div class="tile" data-i="'+i+'" data-k="'+t.k+'">'+t.t+'</div>'; });
  h+='</div>';
  el("stage").innerHTML=h;
  el("tiles").onclick=function(e){
    var t=e.target.closest(".tile"); if(!t||t.classList.contains("ok")) return;
    if(!M.sel){ M.sel=t; t.classList.add("sel"); return; }
    if(M.sel===t){ t.classList.remove("sel"); M.sel=null; return; }
    if(M.sel.dataset.k===t.dataset.k){
      M.sel.classList.remove("sel"); M.sel.classList.add("ok"); t.classList.add("ok");
      M.sel=null; M.left--; el("left").textContent=M.left+" пар";
      if(M.left===0) setTimeout(finishDay,500);
    } else {
      var a=M.sel; a.classList.add("bad"); t.classList.add("bad");
      setTimeout(function(){ a.classList.remove("bad","sel"); t.classList.remove("bad"); },450);
      M.sel=null;
    }
  };
}
function finishDay(){
  markDone(S.day); renderDays();
  el("stage").innerHTML='<div class="panel done"><div class="big">🍊</div>'+
    '<h2>День '+S.day+' закрыт</h2>'+
    '<p class="hint" style="margin:10px 0 18px">Отметьте блок «Слова» в своей таблице</p>'+
    '<button class="btn" id="next">Следующий день</button> '+
    '<button class="btn ghost" id="again">Пройти ещё раз</button></div>';
  el("next").onclick=function(){ startDay(Math.min(52,S.day+1)); };
  el("again").onclick=function(){ startDay(S.day); };
}
function boot(){
  var opts=""; for(var d=1;d<=52;d++){ opts+='<option value="'+d+'">День '+d+'</option>'; }
  el("daysel").innerHTML=opts;
  S.who=store("esp_who")||"papa"; renderWho();
  el("who").onclick=function(e){ var b=e.target.closest("button[data-who]"); if(!b) return;
    S.who=b.dataset.who; store("esp_who",S.who); renderWho(); startDay(today()); };
  el("daysel").onchange=function(){ startDay(parseInt(this.value,10)); };
  el("weeks").onclick=function(e){ var d=e.target.closest(".dot"); if(d) startDay(parseInt(d.dataset.day,10)); };
  startDay(today());
}
boot();
</script>
