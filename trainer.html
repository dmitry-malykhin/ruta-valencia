<title>Тренажёр слов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--ground:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF1F8;--line:#D3DCEA;
--ink:#0F1C33;--ink-soft:#4A5872;--ink-faint:#7C8AA3;--cobalt:#1B4FA8;--cobalt-soft:#E3EBF9;
--naranja:#D45B12;--naranja-soft:#FBE8DB;--verde:#256B4E;--verde-soft:#DFF0E6;
--shadow:0 1px 2px rgba(15,28,51,.06),0 10px 30px rgba(15,28,51,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;--ink:#E7EDF8;
--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;
--ink:#E7EDF8;--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:var(--ink)}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:Bitter,Georgia,serif;margin:0;text-wrap:balance}
h1{font-size:clamp(23px,4vw,32px)}
h2{font-size:20px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--ink-faint)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.who button.on{background:var(--cobalt);color:#fff;border-color:transparent;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select,input,.btn{font:inherit}
select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
border-radius:9px;padding:7px 10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;
cursor:pointer;background:var(--cobalt);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.rounds{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rnd{flex:1;min-width:92px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;
font-size:12px;color:var(--ink-faint);text-align:center;background:var(--surface-2)}
.rnd.now{border-color:var(--naranja);color:var(--naranja);font-weight:600;background:var(--naranja-soft)}
.rnd.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);font-weight:600}
.rnd.lock{opacity:.45}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:4px 0 12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;color:var(--cobalt)}
.stat .k{font-size:12px;color:var(--ink-faint);margin-top:3px}
table.hard{width:100%;border-collapse:collapse;font-size:14px}
table.hard td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.hard td.e{text-align:right;color:var(--naranja);font-weight:600;
font-family:"IBM Plex Mono",monospace}
.card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:10px;padding:26px 18px;text-align:center;user-select:none}
.card.tap{cursor:pointer}
.es{font-size:clamp(28px,5.5vw,42px);font-weight:650}
.ru{font-size:clamp(19px,3.6vw,26px);color:var(--verde);font-weight:500}
.ask{font-size:clamp(21px,4vw,30px);font-weight:600}
.hint{font-size:13px;color:var(--ink-faint)}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-faint);margin:8px 2px 10px}
.pill{padding:3px 10px;border-radius:999px;font-weight:600}
.pill.learn{background:var(--naranja-soft);color:var(--naranja)}
.pill.know{background:var(--verde-soft);color:var(--verde)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{flex:1}
.acts .btn.ghost{flex:0 0 auto;min-width:56px}
.acts .no{background:var(--naranja)}
.acts .yes{background:var(--verde)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 12px;font-size:15.5px;cursor:pointer;text-align:left;line-height:1.35}
.opt:hover{border-color:var(--cobalt)}
.opt.ok{background:var(--verde-soft);border-color:transparent;color:var(--verde);font-weight:600}
.opt.bad{background:var(--naranja-soft);border-color:transparent;color:var(--naranja)}
.type{display:flex;gap:8px;margin-top:12px}
.type input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:13px 14px;font-size:18px;color:var(--ink)}
.type input::placeholder{color:var(--ink-faint)}
.type input:disabled{opacity:.7}
.type input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
.verdict{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:15px}
.verdict.ok{background:var(--verde-soft);color:var(--verde)}
.verdict.bad{background:var(--naranja-soft);color:var(--naranja)}
.verdict b{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 10px;font-size:15px;cursor:pointer;text-align:center;min-height:54px;
display:flex;align-items:center;justify-content:center}
.tile:hover{border-color:var(--cobalt)}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);opacity:.5}
.tile.bad{border-color:var(--naranja);background:var(--naranja-soft)}
.done{text-align:center;padding:24px 12px}
.done .big{font-size:40px}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dot{width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer}
.dot.ok{background:var(--verde-soft);color:var(--verde);border-color:transparent;font-weight:600}
.dot.now{border-color:var(--naranja);color:var(--naranja);font-weight:700}
.warn{background:var(--naranja-soft);color:var(--naranja);border-radius:10px;padding:11px 14px;
font-size:13.5px;margin-bottom:12px}
.audio{background:var(--cobalt-soft);border:1px solid transparent;color:var(--cobalt);
border-radius:999px;width:62px;height:62px;font-size:25px;cursor:pointer;display:flex;
align-items:center;justify-content:center;transition:transform .12s}
.audio:hover{transform:scale(1.06)}
.audio:active{transform:scale(.94)}
.audio.playing{background:var(--cobalt);color:#fff}
.card{position:relative}
.reveal{width:100%;margin-top:12px}
.kbd{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);border:1px solid var(--line);
border-radius:5px;padding:1px 6px;font-size:11.5px}
.tip{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:12px}
.auto{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.auto input{width:16px;height:16px;accent-color:var(--cobalt)}
.voicebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
padding-top:10px;border-top:1px dashed var(--line)}
.voicebar select{flex:1;min-width:180px;max-width:420px}
.voicebar .lab{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
footer{margin-top:24px;font-size:12.5px;color:var(--ink-faint);text-align:center}
a{color:var(--cobalt)}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <p class="eyebrow"><a href="./" style="text-decoration:none">← Ruta Valencia</a></p>
  <h1>Тренажёр слов</h1>
  <p style="color:var(--ink-soft);margin-top:6px">Пять кругов на каждое слово: узнал, выбрал, написал, услышал, сыграл.</p>
  <div class="who" id="who"></div>
  <div class="warn" id="warn" style="display:none"></div>
  <div class="panel">
    <div class="bar">
      <span style="font-weight:600" id="setname">—</span>
      <span class="row"><select id="daysel"></select><span class="mono" id="progress"></span>
      <label class="auto"><input type="checkbox" id="auto" checked>Автозвук</label><button class="btn ghost sm" id="restart">Начать день заново</button></span>
    </div>
    <div class="voicebar">
      <span class="lab">Голос</span>
      <select id="voice"></select>
      <button class="btn ghost sm" id="tryvoice">🔊 Проверить</button>
    </div>
    <div class="rounds" id="rounds"></div>
    <div class="days" id="days"></div>
    <div class="tools">
      <button class="btn ghost" id="stats">Статистика</button>
      <button class="btn ghost" id="hard">Трудные слова</button>
      <button class="btn ghost" id="dl">Скачать прогресс</button>
      <button class="btn ghost" id="up">Загрузить прогресс</button>
      <input type="file" id="file" accept="application/json" style="display:none">
    </div>
  </div>
  <div id="stage"></div>
  <footer>Прогресс хранится в этом браузере, у каждого свой.</footer>
</div>

  r.ru=w[1]; st[k]=r; ls(wkey(),JSON.stringify(st));
}
function hardWords(n){
  var st=wordStats(), a=[];
  for(var k in st){ if(st[k].e>0) a.push([k,st[k].ru,st[k].e]) }
  a.sort(function(x,y){return y[2]-x[2]});
  return a.slice(0,n||20);
}
function skey(d){return "esp2_state_"+S.who+"_"+d}
function saveState(){
  if(S.mode!=="day") return;
  try{ls(skey(S.day),JSON.stringify({r:S.round,i:S.idx,ok:S.ok,w:S.wrong,q:S.queue}))}catch(e){}
}
function clearState(){try{localStorage.removeItem(skey(S.day))}catch(e){}}
function loadState(){
  try{var v=JSON.parse(ls(skey(S.day))||"null");
    if(v&&v.r===S.round&&v.q&&v.q.length){S.queue=v.q;S.idx=v.i;S.ok=v.ok;S.wrong=v.w;return true}
  }catch(e){}
  return false;
}
function roundsDone(d){var v=parseInt(ls(rkey(d))||"0",10);return isNaN(v)?0:v}
function saveRound(d,n){ls(rkey(d),String(n))}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return (s||"").toLowerCase().trim().replace(/[¡¿!?.,]/g,"")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}

/* ---------- озвучка ---------- */
var VOICES=[], esVoice=null;
var SAMPLE="Hola, buenos días. ¿Cuánto cuesta un café con leche?";
function rank(v){
  var n=(v.name||"").toLowerCase(), l=(v.lang||"").toLowerCase(), r=0;
  if(l.indexOf("es-es")===0||l.indexOf("es_es")===0) r+=100;      // Испания
  if(/premium|enhanced|natural|neural/.test(n)) r+=40;            // улучшенные
  if(/m[oó]nica|marisol|paulina|lucia|elvira|sabina/.test(n)) r+=20;
  if(/compact|eloquence/.test(n)) r-=30;                          // роботные
  return r;
}
function collectVoices(){
  var v=[]; try{ v=window.speechSynthesis.getVoices()||[] }catch(e){}
  VOICES=v.filter(function(x){return /^es[-_]?/i.test(x.lang||"")})
          .sort(function(a,b){return rank(b)-rank(a)});
  var saved=ls("esp_voice");
  esVoice=VOICES.filter(function(x){return x.name===saved})[0] || VOICES[0] || null;
  renderVoices();
  return VOICES.length>0;
}
function renderVoices(){
  var sel=el("voice"); if(!sel) return;
  if(!VOICES.length){ sel.innerHTML='<option>голосов не найдено</option>'; sel.disabled=true; return; }
  sel.disabled=false;
  sel.innerHTML=VOICES.map(function(v){
    var mark=/^es-?es/i.test(v.lang)?"Испания":"Лат. Америка";
    var good=/premium|enhanced|natural|neural/i.test(v.name)?" ★":"";
    return '<option value="'+v.name.replace(/"/g,"")+'"'+(esVoice&&v.name===esVoice.name?" selected":"")+
           '>'+v.name+good+" · "+mark+'</option>';
  }).join("");
  var w=el("warn"); if(w) w.style.display="none";
}
function initVoice(){
  if(!("speechSynthesis" in window)){
    showWarn("Браузер не умеет озвучивать текст. Слушайте слова на Forvo или в Quizlet."); return;
  }
  collectVoices();
  try{ window.speechSynthesis.onvoiceschanged=collectVoices }catch(e){}
  setTimeout(function(){
    if(!VOICES.length) showWarn("Испанских голосов в системе нет. "+
      "macOS: Системные настройки → Универсальный доступ → Проверка вслух → Системный голос → "+
      "Управление голосами → испанский, берите вариант с пометкой Enhanced или Premium. "+
      "Windows: Параметры → Время и язык → Речь → добавить испанский голос.");
  },1200);
}
function speak(t){
  if(!("speechSynthesis" in window))return;
  try{ if(!esVoice) collectVoices();
    var u=new SpeechSynthesisUtterance(t); u.lang=(esVoice&&esVoice.lang)||"es-ES"; u.rate=0.9;
    if(esVoice) u.voice=esVoice;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function showWarn(t){var w=el("warn");if(!w)return;w.textContent=t;w.style.display="block"}

/* ---------- каркас ---------- */
function renderWho(){var h="";WHO.forEach(function(w){
  h+='<button data-who="'+w.id+'"'+(w.id===S.who?' class="on"':'')+'>'+w.name+'</button>'});el("who").innerHTML=h}
function renderDays(){var d=done(),h="";
  for(var i=1;i<=52;i++){h+='<div class="dot'+(d.indexOf(i)>=0?" ok":"")+(i===S.day?" now":"")+'" data-day="'+i+'">'+i+'</div>'}
  el("days").innerHTML=h; el("progress").textContent=d.length+" / 52 дней"}
function renderRounds(){
  var passed=roundsDone(S.day), h="";
  ROUNDS.forEach(function(r,i){
    var cls=(i===S.round?"now":(i<passed?"ok":"lock"));
    h+='<div class="rnd '+cls+'">'+r.t+(cls==="ok"?" ✓":"")+'</div>';
  });
  el("rounds").innerHTML=h;
}
function startDay(d){
  S.day=d;
  var r=roundsDone(d); S.round=(r>=ROUNDS.length?0:r);
  el("setname").textContent=setFor(d).name; el("daysel").value=d;
  renderDays(); startRound();
}
function startRound(){
  renderRounds();
  S.queue=sh(pool()); S.idx=0; S.wrong=0; S.ok=0;
  loadState();
  var k=ROUNDS[S.round].k;
  if(k==="match") return renderMatch();
  step();
}
function nextRound(){ S.round++; if(S.round>=ROUNDS.length) return finish(); startRound(); }
function head(){
  var left=Math.max(0,S.queue.length-S.idx);
  return '<div class="counter"><span class="pill learn">Ошибок: '+S.wrong+'</span>'+
    '<span class="mono">Осталось: '+left+'</span>'+
    '<span class="pill know">Верно: '+S.ok+'</span></div>';
}
function step(){
  if(S.idx>=S.queue.length) return roundDone();
  var k=ROUNDS[S.round].k;
  if(k==="cards")  return rCards();
  if(k==="choose") return rChoose();
  if(k==="type")   return rType();
  if(k==="listen") return rListen();
}
function roundDone(){
  keys({});
  clearState();
  if(S.mode==="day" && S.round+1>roundsDone(S.day)) saveRound(S.day,S.round+1);
  el("stage").innerHTML='<div class="panel done"><div class="big">✓</div><h2>'+ROUNDS[S.round].t+
    ' пройден</h2><p class="hint" style="margin:8px 0 16px">Верно '+S.ok+', ошибок '+S.wrong+'</p>'+
    '<button class="btn" id="go">Дальше</button> <button class="btn ghost" id="re">Ещё раз</button></div>';
  el("go").onclick=nextRound; el("re").onclick=startRound;
}

/* ---------- общее ---------- */
function autoOn(){ return ls("esp_auto")!=="0" }
function audioBtn(word,id){
  return '<button class="audio" id="'+(id||"spk")+'" aria-label="Послушать">🔊</button>';
}
function bindAudio(word,id){
  var b=el(id||"spk"); if(!b) return;
  b.onclick=function(){ b.classList.add("playing");
    setTimeout(function(){b.classList.remove("playing")},700); speak(word); };
}
var keyHandler=null;
function keys(map){
  if(keyHandler) document.removeEventListener("keydown",keyHandler);
  keyHandler=function(e){
    if(/input|textarea/i.test((e.target.tagName||""))) return;
    var k=e.key==="\u0020"?"space":e.key.toLowerCase();
    if(map[k]){ e.preventDefault(); map[k](); }
  };
  document.addEventListener("keydown",keyHandler);
}

/* ---------- круг 1: карточки ---------- */
function rCards(){
  var w=S.queue[S.idx];
  el("stage").innerHTML=head()+
   '<div class="card"><div class="es">'+w[0]+'</div>'+audioBtn(w[0])+
   '<div class="ru" id="ru" style="display:none">'+w[1]+'</div></div>'+
   '<button class="btn reveal" id="show">Показать перевод</button>'+
   '<p class="tip"><span class="kbd">Пробел</span> показать перевод · <span class="kbd">R</span> послушать</p>';
  bindAudio(w[0]);
  if(autoOn()) speak(w[0]);
  function reveal(){
    if(el("ru").style.display!=="none") return;
    el("ru").style.display="block"; speak(w[0]);
    el("show").outerHTML='<div class="acts" id="acts">'+
      '<button class="btn no" id="n">Не вспомнил</button>'+
      '<button class="btn yes" id="y">Знаю</button></div>';
    el("n").onclick=function(){noteAnswer(w,false);S.wrong++;S.queue.push(w);S.idx++;saveState();step()};
    el("y").onclick=function(){noteAnswer(w,true);S.ok++;S.idx++;saveState();step()};
    keys({r:function(){speak(w[0])},
          "1":function(){el("n").click()},"2":function(){el("y").click()}});
    el("stage").querySelector(".tip").innerHTML=
      '<span class="kbd">1</span> не вспомнил · <span class="kbd">2</span> знаю · <span class="kbd">R</span> послушать';
  }
  el("show").onclick=reveal;
  keys({space:reveal,enter:reveal,r:function(){speak(w[0])}});
}

/* ---------- круг 2: выбор перевода ---------- */
function rChoose(){
  var all=pool().length>3?pool():setFor(S.day).w, w=S.queue[S.idx];
  var wrong=sh(all.filter(function(x){return x[1]!==w[1]})).slice(0,3).map(function(x){return x[1]});
  var opts=sh(wrong.concat([w[1]]));
  var h=head()+'<div class="card"><div class="es">'+w[0]+'</div>'+audioBtn(w[0])+'</div><div class="opts">';
  opts.forEach(function(o,i){h+='<button class="opt" data-o="'+i+'">'+(i+1)+'. '+o+'</button>'});
  el("stage").innerHTML=h+'</div><p class="tip"><span class="kbd">1</span>–<span class="kbd">4</span> выбрать · <span class="kbd">R</span> послушать</p>';
  bindAudio(w[0]); if(autoOn()) speak(w[0]);
  var btns=el("stage").querySelectorAll(".opt"), locked=false;
  function pick(i){
    if(locked) return; locked=true;
    var b=btns[i];
    if(opts[i]===w[1]){ b.classList.add("ok"); noteAnswer(w,true); S.ok++; S.idx++; saveState(); setTimeout(step,420); }
    else{ b.classList.add("bad"); noteAnswer(w,false); S.wrong++; S.queue.push(w); saveState();
      Array.prototype.forEach.call(btns,function(x,j){if(opts[j]===w[1])x.classList.add("ok")});
      speak(w[0]); S.idx++; setTimeout(step,1400); }
  }
  Array.prototype.forEach.call(btns,function(b,i){ b.onclick=function(){pick(i)} });
  keys({"1":function(){pick(0)},"2":function(){pick(1)},"3":function(){pick(2)},
        "4":function(){pick(3)},r:function(){speak(w[0])}});
}

/* ---------- круг 3: пишу сам ---------- */
function rType(){
  var w=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="hint">напишите по-испански</div><div class="ask">'+w[1]+'</div></div>'+
    '<div class="type"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" '+
    'placeholder="слово по-испански"><button class="btn" id="ok">Проверить</button></div>'+
    '<div id="v"></div><p class="tip"><span class="kbd">Enter</span> проверить</p>';
  keys({});
  var inp=el("inp"); inp.focus();
  var doneOnce=false;
  function check(){
    if(doneOnce) return; var a=norm(inp.value); if(!a) return; doneOnce=true;
    var good=a===norm(w[0]);
    noteAnswer(w,good);
    if(good){ S.ok++; el("v").innerHTML='<div class="verdict ok">Верно: <b>'+w[0]+'</b></div>'; }
    else{ S.wrong++; S.queue.push(w);
      el("v").innerHTML='<div class="verdict bad">Правильно: <b>'+w[0]+'</b><br>'+
      '<span style="font-size:13.5px">вы написали: '+inp.value+'</span></div>'; }
    speak(w[0]); inp.disabled=true; el("ok").disabled=true; saveState();
    setTimeout(step,good?800:2100);
  }
  el("ok").onclick=check;
  inp.onkeydown=function(e){ if(e.key==="Enter") check() };
}

/* ---------- круг 4: на слух ---------- */
function rListen(){
  var w=S.queue[S.idx];
  el("stage").innerHTML=head()+
    '<div class="card"><div class="hint">послушайте и напишите по-испански</div>'+
    audioBtn(w[0])+'<div class="hint">слушать можно сколько угодно раз</div></div>'+
    '<div class="type"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" '+
    'placeholder="что услышали"><button class="btn" id="ok">Проверить</button></div>'+
    '<div id="v"></div><p class="tip"><span class="kbd">Enter</span> проверить · кнопка 🔊 повторяет</p>';
  bindAudio(w[0]); keys({}); speak(w[0]);
  var inp=el("inp"); inp.focus(); var doneOnce=false;
  function check(){
    if(doneOnce) return; var a=norm(inp.value); if(!a) return; doneOnce=true;
    var good=a===norm(w[0]);
    noteAnswer(w,good);
    if(good){S.ok++} else {S.wrong++;S.queue.push(w)}
    saveState();
    el("v").innerHTML='<div class="verdict '+(good?"ok":"bad")+'"><b>'+w[0]+'</b> — '+w[1]+'</div>';
    speak(w[0]); inp.disabled=true; el("ok").disabled=true; setTimeout(step,good?900:2100);
  }
  el("ok").onclick=check; inp.onkeydown=function(e){if(e.key==="Enter")check()};
}

/* ---------- круг 5: подбор ---------- */
var M={sel:null,left:0};
function renderMatch(){
  keys({});
  var pick=sh(pool()).slice(0,8), tiles=[];
  pick.forEach(function(p,i){tiles.push({k:i,t:p[0]});tiles.push({k:i,t:p[1]})});
  tiles=sh(tiles); M.sel=null; M.left=pick.length;
  var h='<div class="panel bar"><span>Соедините пары</span><span class="mono" id="left">'+M.left+' пар</span></div><div class="grid" id="t">';
  tiles.forEach(function(t,i){h+='<div class="tile" data-i="'+i+'" data-k="'+t.k+'">'+t.t+'</div>'});
  el("stage").innerHTML=h+'</div>';
  el("t").onclick=function(e){
    var t=e.target.closest(".tile"); if(!t||t.classList.contains("ok"))return;
    if(!M.sel){M.sel=t;t.classList.add("sel");return}
    if(M.sel===t){t.classList.remove("sel");M.sel=null;return}
    if(M.sel.dataset.k===t.dataset.k){
      M.sel.classList.remove("sel");M.sel.classList.add("ok");t.classList.add("ok");
      M.sel=null;M.left--;el("left").textContent=M.left+" пар";
      if(!M.left)setTimeout(finish,500);
    } else {var a=M.sel;a.classList.add("bad");t.classList.add("bad");
      setTimeout(function(){a.classList.remove("bad","sel");t.classList.remove("bad")},420);M.sel=null}
  };
}
function finish(){
  keys({}); clearState();
  if(S.mode==="hard"){
    el("stage").innerHTML='<div class="panel done"><div class="big">💪</div>'+
      '<h2>Трудные слова пройдены</h2><button class="btn" id="back">Вернуться к дню</button></div>';
    el("back").onclick=function(){S.mode="day";startDay(S.day)};
    return;
  }
  saveRound(S.day,ROUNDS.length); mark(S.day); S.round=ROUNDS.length;
  renderDays(); renderRounds();
  el("stage").innerHTML='<div class="panel done"><div class="big">🍊</div><h2>День '+S.day+' закрыт</h2>'+
    '<p class="hint" style="margin:8px 0 16px">Отметьте блок «Слова» в своей таблице</p>'+
    '<button class="btn" id="n">Следующий день</button> <button class="btn ghost" id="r">Пройти заново</button></div>';
  el("n").onclick=function(){startDay(Math.min(52,S.day+1))};
  el("r").onclick=function(){startDay(S.day)};
}
function showStats(){
  keys({});
  var st=wordStats(), seen=0, err=0, ok=0;
  for(var k in st){seen++; err+=st[k].e; ok+=st[k].ok}
  var acc=(ok+err)?Math.round(ok*100/(ok+err)):0;
  var d=done().slice().sort(function(a,b){return a-b});
  var streak=0; for(var i=d.length-1;i>=0;i--){ if(i===d.length-1||d[i+1]-d[i]===1) streak++; else break }
  var hard=hardWords(12);
  var h='<div class="panel"><h2 style="margin-bottom:12px">Статистика · '+who().name+'</h2>'+
    '<div class="stats">'+
    '<div class="stat"><div class="v">'+d.length+'</div><div class="k">дней пройдено</div></div>'+
    '<div class="stat"><div class="v">'+streak+'</div><div class="k">дней подряд</div></div>'+
    '<div class="stat"><div class="v">'+seen+'</div><div class="k">слов в работе</div></div>'+
    '<div class="stat"><div class="v">'+acc+'%</div><div class="k">верных ответов</div></div>'+
    '</div>';
  if(hard.length){
    h+='<h2 style="font-size:16px;margin:6px 0 8px">Чаще всего ошибаетесь</h2><table class="hard">';
    hard.forEach(function(x){h+='<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td class="e">'+x[2]+'</td></tr>'});
    h+='</table>';
  } else { h+='<p class="hint">Ошибок пока нет.</p>' }
  h+='<div class="tools" style="margin-top:14px"><button class="btn" id="close">Вернуться</button></div></div>';
  el("stage").innerHTML=h;
  el("close").onclick=function(){startDay(S.day)};
}
function startHard(){
  var hw=hardWords(20);
  if(hw.length<4){
    el("stage").innerHTML='<div class="panel done"><h2>Пока нечего повторять</h2>'+
     '<p class="hint" style="margin:8px 0 16px">Трудные слова появятся после ошибок</p>'+
     '<button class="btn" id="b">Вернуться</button></div>';
    el("b").onclick=function(){startDay(S.day)}; return;
  }
  S.mode="hard"; S.hardList=hw.map(function(x){return [x[0],x[1]]});
  S.round=0; el("setname").textContent="Трудные слова · "+S.hardList.length;
  startRound();
}
function exportProgress(){
  var out={who:S.who,saved:new Date().toISOString(),data:{}};
  try{ for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k.indexOf("esp")===0) out.data[k]=localStorage.getItem(k)} }catch(e){}
  var b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="espanol-progreso-"+S.who+".json";
  document.body.appendChild(a); a.click(); a.remove();
}
function importProgress(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ var j=JSON.parse(r.result);
      for(var k in j.data){ localStorage.setItem(k,j.data[k]) }
      alert("Прогресс загружен"); location.reload();
    }catch(err){ alert("Не удалось прочитать файл") }
  };
  r.readAsText(f);
}
function boot(){
  var o="";for(var d=1;d<=52;d++)o+='<option value="'+d+'">День '+d+'</option>';
  el("daysel").innerHTML=o;
  S.who=ls("esp_who")||"dmitry"; renderWho();
  el("who").onclick=function(e){var b=e.target.closest("button[data-who]");if(!b)return;
    S.who=b.dataset.who;ls("esp_who",S.who);renderWho();startDay(today())};
  el("daysel").onchange=function(){startDay(parseInt(this.value,10))};
  el("days").onclick=function(e){var d=e.target.closest(".dot");if(d)startDay(parseInt(d.dataset.day,10))};
  el("voice").onchange=function(){
    var v=VOICES.filter(function(x){return x.name===this.value}.bind(this))[0];
    if(v){esVoice=v; ls("esp_voice",v.name); speak(SAMPLE);}
  };
  el("tryvoice").onclick=function(){speak(SAMPLE)};
  el("auto").checked=autoOn();
  el("auto").onchange=function(){ls("esp_auto",this.checked?"1":"0")};
  el("restart").onclick=function(){ clearState(); saveRound(S.day,0); startDay(S.day) };
  el("stats").onclick=showStats;
  el("hard").onclick=startHard;
  el("dl").onclick=exportProgress;
  el("up").onclick=function(){el("file").click()};
  el("file").onchange=importProgress;
  initVoice(); startDay(today());
}
boot();
</script>
