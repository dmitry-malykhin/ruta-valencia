    {n:"Dreaming Spanish", s:"Dreaming Spanish · super beginner, слушать и повторять",
     href:"https://www.youtube.com/@DreamingSpanish/search?query=super%20beginner"},
    {n:"Español con Juan", s:"Español con Juan · живая речь, кастильский",
     href:"https://www.youtube.com/@espanolconjuan/videos"},
    {n:"Easy Spanish",     s:"Easy Spanish · интервью на улице с субтитрами",
     href:"https://www.youtube.com/@EasySpanish/videos"}]
};
WATCH.dmitry=WATCH.adult; WATCH.yulia=WATCH.adult;
var WHO=[{id:"dmitry",name:"Дмитрий",kid:false},{id:"yulia",name:"Юлия",kid:false},
         {id:"mihail",name:"Михаил",kid:true},{id:"darya",name:"Дарья",kid:true}];
var CYCLE=[["numeros","Числа и цены"],["fechas","Дни, месяцы, даты"],["tiempo","Погода и small talk"],
           ["presentarse","Знакомство и о себе"],["adjetivos","Прилагательные парами"],
           ["numeros","Числа на слух"],["hora","Время на слух"]];
var S={who:"dmitry",day:1};

function el(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function today(){var n=new Date(); n=new Date(n.getTime()-4*36e5);
  n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.max(1,Math.min(52,Math.floor((n-START)/864e5)+1))}
function who(){return WHO.filter(function(w){return w.id===S.who})[0]}
function num(k){var v=parseInt(ls(k)||"0",10);return isNaN(v)?0:v}
function manual(id){return ls("hoy_"+S.who+"_"+S.day+"_"+id)==="1"}
function setManual(id,on){ls("hoy_"+S.who+"_"+S.day+"_"+id,on?"1":"0")}
function themeOf(d){return CYCLE[(d-1)%7]}

function blocks(){
  var d=S.day, kid=who().kid, th=themeOf(d), out=[];
  if(!kid){
    out.push({id:"petrov",auto:false,min: d<=16?45:20,
      t: d<=16 ? ("Урок Петрова № "+d) : "Грамматика: повтор таблиц",
      s: d<=16 ? "45 минут, отвечать вслух на каждой паузе" : "разбор слабых мест",
      href: d<=16 ? ("https://smotrim.ru/video/"+VID[d-1]) : "./verbos.html",
      go: d<=16 ? "Смотреть" : "Открыть"});
    out.push({id:"verbos",auto:true,min:15,t:"Спряжение глаголов",
      s:(DAY_VERBS[d]||[]).join(", ")||"повтор пройденных",
      href:"./verbos.html",go:"Тренировать",
      done: num("verb_r_"+S.who+"_"+d)>=(d>=2?5:4)});
  }
  out.push({id:"words",auto:true,min:kid?10:25,
    t: kid?"Фразы дня":"Слова дня, 15 штук",
    s: DAY_NAME[d]||"набор дня", href:"./trainer.html", go:"Учить",
    done: num("esp2_r_"+S.who+"_"+d)>=6});
  var watch=WATCH[S.who]||WATCH.adult, pick=watch[(d-1)%watch.length];
  out.push({id:"audio",auto:false,min:kid?18:25,fon:true,
    t: kid?"Видео на испанском":"Аудирование и шэдоуинг (фоном)",
    s: pick.s, href: pick.href, go:"Смотреть", more: watch});
  if(!kid) out.push({id:"speech",auto:false,min:15,t:"Речь по скрипту дня",
    s:"вслух, вдвоём. Вторник и пятница — обмен в Tandem",
    href:"https://tandem.net/",go:"Tandem"});
  out.push({id:"tema",auto:true,min:10,t:"Тема дня: "+th[1],
    s:"числа, даты, погода, знакомство по кругу",
    href:"./temas.html#"+th[0], go:"Тренировать",
    done: num("tema_r_"+S.who+"_"+th[0])>=5});
  return out;
}
function dayState(d){
  var save=S.day; S.day=d;
  var b=blocks(), done=0;
  b.forEach(function(x){ if(x.auto? x.done : manual(x.id)) done++ });
  S.day=save;
  return {done:done,total:b.length};
}
function firstOpenDay(){
  for(var d=1;d<=today();d++){ var st=dayState(d); if(st.done<st.total) return d }
  return today();
}
function planLine(){
  var plan=today(), open=firstOpenDay();
  if(S.day===plan && open===plan) return "";
  var M=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var pd=new Date(START.getTime()+(plan-1)*864e5);
  var txt="По календарю сегодня <b>день "+plan+"</b>, "+pd.getDate()+" "+M[pd.getMonth()]+".";
  if(open<plan) txt+=" Не закрыт <b>день "+open+"</b>, отставание "+(plan-open)+
    (plan-open===1?" день":(plan-open<5?" дня":" дней"))+".";
  if(S.day!==plan) txt+=' <button class="btn ghost sm" id="goplan">Перейти на день '+plan+'</button>';
  if(open<plan && S.day!==open) txt+=' <button class="btn ghost sm" id="goopen">Доделать день '+open+'</button>';
  return txt;
}
function renderWho(){el("who").innerHTML=WHO.map(function(w){
  return '<button data-who="'+w.id+'"'+(w.id===S.who?' class="on"':'')+'>'+w.name+'</button>'}).join("")}
function renderDays(){
  var h="",t=today();
  for(var d=1;d<=52;d++){
    var st=dayState(d), c="dot";
    if(st.done>=st.total) c+=" ok"; else if(st.done>0) c+=" part";
    if(d===t) c+=" plan";
    if(d===S.day) c+=" now";
    h+='<div class="'+c+'" data-day="'+d+'" title="'+st.done+' из '+st.total+'">'+d+'</div>';
  }
  el("days").innerHTML=h;
}
function render(){
  var b=blocks(), done=0;
  var dt=new Date(START.getTime()+(S.day-1)*864e5);
  var M=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  el("dayline").textContent="День "+S.day+" · "+dt.getDate()+" "+M[dt.getMonth()];
  var h="";
  b.forEach(function(x){
    var ok = x.auto ? !!x.done : manual(x.id);
    if(ok) done++;
    h+='<div class="blk'+(ok?" done":"")+'">'+
       '<div class="box'+(ok?" on":"")+(x.auto?" auto":"")+'" data-id="'+x.id+'" data-auto="'+(x.auto?1:0)+'">'+(ok?"✓":"")+'</div>'+
       '<div class="body"><div class="t">'+x.t+'</div><div class="s">'+x.s+
       (x.auto?' · <span class="tag2">отмечается сам</span>':'')+'</div></div>'+
       '<span class="min">'+x.min+' мин'+(x.fon?' · фоном':'')+'</span>'+
       '<a class="go" href="'+x.href+'"'+(/^http/.test(x.href)?' target="_blank" rel="noopener"':'')+'>'+x.go+'</a></div>'+
       (x.more?'<div class="more">'+x.more.map(function(m){
          return '<a href="'+m.href+'" target="_blank" rel="noopener">'+m.n+'</a>'}).join("")+'</div>':'');
  });
  el("list").innerHTML=h;
  var pl=planLine();
  el("plan").innerHTML=pl; el("plan").style.display= pl?"block":"none";
  if(el("goplan")) el("goplan").onclick=function(){S.day=today();render()};
  if(el("goopen")) el("goopen").onclick=function(){S.day=firstOpenDay();render()};
  el("ring").textContent=done+" из "+b.length;
  var sit=b.filter(function(x){return !x.fon}).reduce(function(a,x){return a+x.min},0);
  var fon=b.filter(function(x){return x.fon}).reduce(function(a,x){return a+x.min},0);
  el("sum").textContent=(done>=b.length?"день закрыт · ":"осталось "+(b.length-done)+" · ")+
    sit+" мин за столом + "+fon+" фоном";
  renderDays();
}
function boot(){
  var whoFromUrl=(location.search.match(/who=([a-z]+)/)||[])[1];
  if(whoFromUrl && WHO.some(function(person){return person.id===whoFromUrl})) ls("esp_who",whoFromUrl);
  S.who=ls("esp_who")||"dmitry";
  if(!WHO.filter(function(w){return w.id===S.who}).length)S.who="dmitry";
  S.day=firstOpenDay();
  var o="";for(var d=1;d<=52;d++)o+='<option value="'+d+'">День '+d+'</option>';
  el("daysel").innerHTML=o; el("daysel").value=S.day;
  renderWho();
  el("who").onclick=function(e){var b=e.target.closest("button[data-who]");if(!b)return;
    S.who=b.dataset.who;ls("esp_who",S.who);renderWho();render()};
  el("daysel").onchange=function(){S.day=parseInt(this.value,10);render()};
  el("days").onclick=function(e){var d=e.target.closest(".dot");if(!d)return;
    S.day=parseInt(d.dataset.day,10);el("daysel").value=S.day;render()};
  el("list").onclick=function(e){
    var b=e.target.closest(".box"); if(!b) return;
    if(b.dataset.auto==="1"){
      alert("Эта галочка ставится сама, когда Вы пройдёте тренажёр до конца.");
      return;
    }
    setManual(b.dataset.id, !manual(b.dataset.id)); render();
  };
  window.addEventListener("focus", render);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) render() });
  render();
}
boot();
</script>
