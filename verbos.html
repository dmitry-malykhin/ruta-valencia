<title>Спряжение глаголов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--ground:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF1F8;--line:#D3DCEA;
--ink:#0F1C33;--ink-soft:#4A5872;--ink-faint:#7C8AA3;--cobalt:#1B4FA8;--cobalt-soft:#E3EBF9;
--naranja:#D45B12;--naranja-soft:#FBE8DB;--verde:#256B4E;--verde-soft:#DFF0E6;
--shadow:0 1px 2px rgba(15,28,51,.06),0 10px 30px rgba(15,28,51,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;--ink:#E7EDF8;
--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--ground:#0C1421;--surface:#141E2F;--surface-2:#1B2740;--line:#2A3958;
--ink:#E7EDF8;--ink-soft:#AEBCD4;--ink-faint:#7D8DA8;--cobalt:#7BA6F2;--cobalt-soft:#1B2C4C;
--naranja:#F0894A;--naranja-soft:#3A2416;--verde:#5FBF93;--verde-soft:#13301F;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:var(--ink)}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:Bitter,Georgia,serif;margin:0;text-wrap:balance}
h1{font-size:clamp(23px,4vw,32px)}
h2{font-size:20px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--ink-faint)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.who button.on{background:var(--cobalt);color:#fff;border-color:transparent;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select,input,.btn{font:inherit}
select{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
border-radius:9px;padding:7px 10px}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;
cursor:pointer;background:var(--cobalt);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.rounds{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rnd{flex:1;min-width:92px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;
font-size:12px;color:var(--ink-faint);text-align:center;background:var(--surface-2)}
.rnd.now{border-color:var(--naranja);color:var(--naranja);font-weight:600;background:var(--naranja-soft)}
.rnd.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);font-weight:600}
.rnd.lock{opacity:.45}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .btn{padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:4px 0 12px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;color:var(--cobalt)}
.stat .k{font-size:12px;color:var(--ink-faint);margin-top:3px}
table.hard{width:100%;border-collapse:collapse;font-size:14px}
table.hard td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.hard td.e{text-align:right;color:var(--naranja);font-weight:600;
font-family:"IBM Plex Mono",monospace}
.card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;
box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:10px;padding:26px 18px;text-align:center;user-select:none}
.card.tap{cursor:pointer}
.es{font-size:clamp(28px,5.5vw,42px);font-weight:650}
.ru{font-size:clamp(19px,3.6vw,26px);color:var(--verde);font-weight:500}
.ask{font-size:clamp(21px,4vw,30px);font-weight:600}
.hint{font-size:13px;color:var(--ink-faint)}
.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-faint);margin:8px 2px 10px}
.pill{padding:3px 10px;border-radius:999px;font-weight:600}
.pill.learn{background:var(--naranja-soft);color:var(--naranja)}
.pill.know{background:var(--verde-soft);color:var(--verde)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{flex:1}
.acts .btn.ghost{flex:0 0 auto;min-width:56px}
.acts .no{background:var(--naranja)}
.acts .yes{background:var(--verde)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 12px;font-size:15.5px;cursor:pointer;text-align:left;line-height:1.35}
.opt:hover{border-color:var(--cobalt)}
.opt.ok{background:var(--verde-soft);border-color:transparent;color:var(--verde);font-weight:600}
.opt.bad{background:var(--naranja-soft);border-color:transparent;color:var(--naranja)}
.type{display:flex;gap:8px;margin-top:12px}
.type input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:13px 14px;font-size:18px;color:var(--ink)}
.type input::placeholder{color:var(--ink-faint)}
.type input:disabled{opacity:.7}
.type input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
.verdict{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:15px}
.verdict.ok{background:var(--verde-soft);color:var(--verde)}
.verdict.bad{background:var(--naranja-soft);color:var(--naranja)}
.verdict b{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;
padding:14px 10px;font-size:15px;cursor:pointer;text-align:center;min-height:54px;
display:flex;align-items:center;justify-content:center}
.tile:hover{border-color:var(--cobalt)}
.tile.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.tile.ok{border-color:transparent;background:var(--verde-soft);color:var(--verde);opacity:.5}
.tile.bad{border-color:var(--naranja);background:var(--naranja-soft)}
.done{text-align:center;padding:24px 12px}
.done .big{font-size:40px}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dot{width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer}
.dot.ok{background:var(--verde-soft);color:var(--verde);border-color:transparent;font-weight:600}
.dot.now{border-color:var(--naranja);color:var(--naranja);font-weight:700}
.warn{background:var(--naranja-soft);color:var(--naranja);border-radius:10px;padding:11px 14px;
font-size:13.5px;margin-bottom:12px}
.audio{background:var(--cobalt-soft);border:1px solid transparent;color:var(--cobalt);
border-radius:999px;width:62px;height:62px;font-size:25px;cursor:pointer;display:flex;
align-items:center;justify-content:center;transition:transform .12s}
.audio:hover{transform:scale(1.06)}
.audio:active{transform:scale(.94)}
.audio.playing{background:var(--cobalt);color:#fff}
.card{position:relative}
.reveal{width:100%;margin-top:12px}
.kbd{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);border:1px solid var(--line);
border-radius:5px;padding:1px 6px;font-size:11.5px}
.tip{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:12px}
.auto{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.auto input{width:16px;height:16px;accent-color:var(--cobalt)}
.voicebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
padding-top:10px;border-top:1px dashed var(--line)}
.voicebar select{flex:1;min-width:180px;max-width:420px}
.voicebar .lab{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
footer{margin-top:24px;font-size:12.5px;color:var(--ink-faint);text-align:center}
a{color:var(--cobalt)}
@media (max-width:520px){.opts{grid-template-columns:1fr}}

.vtable{width:100%;border-collapse:collapse;font-size:14.5px}
.vtable th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-faint);
padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.vtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td.v{font-weight:600;white-space:nowrap}
.vtable td.f{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--ink-soft)}
.vtable tr.irr td.v{color:var(--naranja)}
.vtable tr:hover td{background:var(--surface-2)}
.legend{font-size:12.5px;color:var(--ink-faint);margin:8px 0 14px}
.legend b{color:var(--naranja)}
.pron{font-size:15px;color:var(--ink-faint);margin-top:4px}
.big-v{font-size:clamp(30px,6vw,44px);font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--cobalt);color:#fff;border-color:transparent;font-weight:600}
</style>

  var acc=(S.ok+S.wrong)?Math.round(S.ok*100/(S.ok+S.wrong)):0;
  el("stage").innerHTML='<div class="panel done"><div class="big">✓</div>'+
    '<h2>Круг пройден</h2><p class="hint" style="margin:8px 0 16px">Верно '+S.ok+
    ', ошибок '+S.wrong+' · точность '+acc+'%</p>'+
    '<button class="btn" id="again">Ещё круг</button> '+
    '<button class="btn ghost" id="tbl">Смотреть таблицу</button></div>';
  el("again").onclick=function(){buildQueue();drill()};
  el("tbl").onclick=table;
}
function table(){
  S.view="table";
  var h='<div class="panel"><p class="legend"><b>Оранжевым</b> — неправильные глаголы. '+
    'Они же самые частотные, поэтому идут первыми. Столбец «День» показывает, в какой день курса это слово учится карточками.</p>'+
    '<div style="overflow-x:auto"><table class="vtable"><tr><th>Глагол</th><th>Перевод</th>'+
    '<th>yo · tú · él · nosotros · vosotros · ellos</th><th>День</th></tr>';
  scopeList().forEach(function(v){
    h+='<tr class="'+(v.irr?"irr":"")+'"><td class="v">'+v.v+'</td><td>'+v.ru+
       '</td><td class="f">'+v.f.join(", ")+'</td><td class="f">'+(v.day?("день "+v.day):"—")+'</td></tr>';
  });
  h+='</table></div><div class="tools" style="margin-top:14px">'+
     '<button class="btn" id="go">Тренировать</button></div></div>';
  el("stage").innerHTML=h;
  el("go").onclick=function(){buildQueue();drill()};
}
function boot(){
  S.who=ls("esp_who")||"dmitry";
  if(!WHO.filter(function(w){return w.id===S.who}).length) S.who="dmitry";
  S.day=today();
  var o=""; for(var d=1;d<=52;d++) o+='<option value="'+d+'">День '+d+'</option>';
  el("daysel").innerHTML=o; el("daysel").value=S.day;
  el("daysel").onchange=function(){S.day=parseInt(this.value,10);S.scope="day";
    renderChips();buildQueue();S.view==="table"?table():drill()};
  S.scope=ls("verb_scope")||"day";
  renderWho(); renderChips();
  el("who").onclick=function(e){var b=e.target.closest("button[data-who]");if(!b)return;
    S.who=b.dataset.who;ls("esp_who",S.who);renderWho();buildQueue();drill()};
  el("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;
    S.scope=b.dataset.s;ls("verb_scope",S.scope);renderChips();
    buildQueue(); S.view==="table"?table():drill()};
  el("tblbtn").onclick=table;
  el("drillbtn").onclick=function(){buildQueue();drill()};
  try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
  pickVoice(); buildQueue(); table();
}
boot();
</script>
